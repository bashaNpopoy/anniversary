<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Grimoire of Us</title>
<meta name="theme-color" content="#1b0b30">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/grimoire.css">
<link rel="stylesheet" href="assets/css/gallery.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<!-- Reusable 4-leaf clover (four hearts + stem): <svg><use href="#clover"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="clover" viewBox="-40 -40 80 80">
 <g fill="currentColor">
  <path id="leaf" d="M0 -2C-14-8-22-22-12-30C-6-35 0-30 0-24C0-30 6-35 12-30C22-22 14-8 0-2Z"/>
  <use href="#leaf" transform="rotate(90)"/><use href="#leaf" transform="rotate(180)"/><use href="#leaf" transform="rotate(270)"/>
 </g>
 <path d="M3 3C8 14 12 22 20 30" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</symbol></defs></svg>

<div id="particles" aria-hidden="true"></div>

<!-- LANDING SCREEN: edit title / subtitle / button text here -->
<section id="cover">
  <div class="seal"><span class="ring"></span><svg class="clover glow"><use href="#clover"/></svg></div>
  <h1>POPOY AND BASHA</h1>
  <p class="sub">A story written by two people.</p>
  <button class="btn" id="openBtn">Open Our Story</button>
</section>

<!-- THE BOOK -->
<main id="book" hidden>
  <header class="topbar">
    <button class="btn small" id="menuBtn" aria-expanded="false">☰ Chapters</button>
    <div id="music">
      <button class="btn small" id="musicBtn">🎵 Music Off</button>
      <div id="musicPanel" hidden>
        <button id="pauseBtn" aria-label="Play or pause">⏯</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volume">
        <button id="stopBtn" aria-label="Stop music">⏹</button>
      </div>
    </div>
  </header>
  <article id="page" tabindex="-1"></article>
</main>

<!-- CHAPTER MENU -->
<nav id="menu" hidden aria-label="Chapters">
  <div class="menu-box"><h2>THE CHAPTERS</h2><ul id="menuList"></ul><button class="btn small" id="menuClose">Close</button></div>
</nav>

<!-- PHOTO LIGHTBOX -->
<div id="lightbox" hidden role="dialog" aria-label="Photo viewer">
  <button id="lbClose" aria-label="Close">✕</button>
  <button id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button id="lbNext" aria-label="Next photo">›</button>
</div>

<script src="assets/js/gallery.js"></script>
<script src="assets/js/music.js"></script>
<script src="assets/js/book.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
